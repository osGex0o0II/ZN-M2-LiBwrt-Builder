# ============================================================
# BBR 拥塞控制 + fq qdisc 传输层调优（通用基线）
# 适用场景：ipq60xx 千兆路由
# 参考：torvalds/linux/net/ipv4/tcp_bbr.c | man tc-fq(8)
#       kernel.org sysctl/net.html | OpenWrt #7733
#       RFC 7413 | Red Hat EL 9/10 网络性能调优
# ============================================================
#
# 256M 硬件使用 files-256m/etc/sysctl.d/10-bbr.conf 覆盖本文件；
# 两处保持同一组值，避免覆盖顺序变化时退回旧的高内存配置。

# BBR（Bottleneck Bandwidth and Round-trip propagation time）：
# 基于带宽估计的拥塞控制算法，替代传统基于丢包的 CUBIC/Reno。
# BBR 要求底层 qdisc 提供 pacing（速率整形）功能。
# fq（Fair Queue）是当前唯一支持 per-flow pacing 的 classless qdisc。
# !!! fq_codel 不含 pacing，BBR + fq_codel 性能下降 6-10 倍 !!!
# 实测数据（OpenWrt #7733）：fq_codel=4-10MB/s, fq=40-60MB/s
net.ipv4.tcp_congestion_control=bbr

# TCP Fast Open（RFC 7413）：
#   0x1 = 客户端模式   0x2 = 服务端模式   0x4 = 客户端无 cookie
#   值 3 = 同时启用客户端和服务端
#   Linux 3.7+ 支持，安全性由 TFO cookie 机制保证
net.ipv4.tcp_fastopen=3

# TCP 缓冲区调优 — 基于带宽延迟积（BDP）计算
# 默认 tcp_adv_win_scale=1 时有效接收窗口约为上限的一半；
# 2MiB 上限 -> 1MiB 窗口，200ms RTT 下单流约 42Mbps。
# 全局 tcp_mem 保持内核默认（本机约 18MB），聚合内存仍有硬顶。
net.core.rmem_max=2097152
net.core.wmem_max=2097152
net.ipv4.tcp_rmem=4096 131072 2097152
net.ipv4.tcp_wmem=4096 65536 2097152

# slow_start_after_idle=0 — 空闲后不重置 cwnd，减少突发延迟
# tcp_notsent_lowat=131072 — 128KiB 未发送水位，避免高 BDP 下限制吞吐
net.ipv4.tcp_slow_start_after_idle=0
net.ipv4.tcp_notsent_lowat=131072

# netdev_max_backlog — NIC 中断积压队列，内核默认 1000；翻倍到 2000
net.core.netdev_max_backlog=2000

# fq qdisc — BBR 依赖 per-flow pacing，fq 是唯一支持 classless qdisc。
# !!! fq_codel 不含 pacing，BBR + fq_codel 性能下降 6-10 倍 !!!
# 实测（OpenWrt #7733）：fq_codel=4-10MB/s, fq=40-60MB/s。
net.core.default_qdisc=fq

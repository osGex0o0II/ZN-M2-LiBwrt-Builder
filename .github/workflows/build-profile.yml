name: Build ZN-M2 profile

on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string

permissions:
  contents: read

jobs:
  firmware:
    name: Experimental ${{ inputs.profile }}
    runs-on: ubuntu-24.04
    # GitHub-hosted runners are hard-capped at 6h; leave headroom so the
    # always() diagnostics upload and cache save still run after a build.
    timeout-minutes: 355
    env:
      PROFILE: ${{ inputs.profile }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CCACHE_DIR: ${{ github.workspace }}/ccache
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl jq device-tree-compiler ccache \
            libelf-dev libfuse-dev xsltproc zstd python-is-python3 patch
      - name: Verify profile and local tests
        run: |
          bash scripts/load-profile.sh "$PROFILE"
          bash tests/test-profile-policy.sh
          bash tests/test-experimental-prepare.sh
          bash tests/test-experimental-logging.sh
          bash tests/test-experimental-package.sh
          bash tests/test-experimental-manifest.sh
          bash tests/test-release-retention.sh
          bash tests/test-release-notes.sh
          bash tests/test-luci-port-order.sh
      - name: Clone fixed source
        run: bash scripts/experimental-build.sh clone "$PROFILE" "$GITHUB_WORKSPACE/openwrt"
      # Restore and save are split so a failing compile still persists ccache.
      # Otherwise every fix iteration rebuilds the whole toolchain from scratch.
      # The download cache matters just as much: without it every run refetches
      # the full toolchain and package tarball set.
      - name: Restore profile cache
        id: profile-cache
        uses: actions/cache/restore@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            ${{ github.workspace }}/openwrt/dl
          key: experimental-${{ runner.os }}-${{ runner.arch }}-${{ inputs.profile }}-${{ hashFiles('deps/**', 'configs/**', 'adapters/**', 'scripts/experimental-*.sh') }}
      - name: Verify pinned LEDE kernel layout
        if: env.PROFILE == 'lede-master-nss'
        run: bash tests/test-lede-netdevice-layout.sh "$GITHUB_WORKSPACE/openwrt" fetch --evidence-dir "$GITHUB_WORKSPACE/.omo/evidence/build-repair"
      - name: Prepare and verify resolved configuration
        run: bash scripts/experimental-build.sh prepare "$PROFILE" "$GITHUB_WORKSPACE/openwrt"
      - name: Build firmware
        timeout-minutes: 300
        run: bash scripts/experimental-build.sh build "$PROFILE" "$GITHUB_WORKSPACE/openwrt"
      - name: Package experimental firmware
        run: bash scripts/experimental-build.sh package "$PROFILE" "$GITHUB_WORKSPACE/openwrt" "$GITHUB_WORKSPACE/release"
      - name: Upload firmware
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: experimental-${{ inputs.profile }}
          path: release/
          if-no-files-found: error
          retention-days: 7
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: diagnostics-${{ inputs.profile }}
          path: |
            openwrt/.config
            openwrt/build_dir/target*/linux-qualcommax_ipq60xx/linux-*/.config
            openwrt/build_dir/target*/linux-qualcommax_ipq60xx/linux-*/include/linux/netdevice.h
            openwrt/defconfig.log
            openwrt/build.log
            openwrt/BUILD-MANIFEST.txt
            openwrt/logs/
            .omo/evidence/build-repair/
          include-hidden-files: true
          retention-days: 7
      - name: Save profile cache
        if: always() && steps.profile-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            ${{ github.workspace }}/openwrt/dl
          key: ${{ steps.profile-cache.outputs.cache-primary-key }}

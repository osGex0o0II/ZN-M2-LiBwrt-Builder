name: ZN-M2 LiBwrt 6.12 NSS （eBPF）

on:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish an opt-in preview after device validation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zn-m2-libwrt-6.12-nss-ebpf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # The called workflow contains a `publish` job that asks for
    # `contents: write`. A reusable-workflow caller caps every nested job, so a
    # workflow-level `contents: read` makes the whole run fail to start with
    # "the nested job 'publish' is requesting 'contents: write'". Granting the
    # ceiling here keeps the rest of the caller read-only.
    permissions:
      contents: write
    uses: ./.github/workflows/zn-m2-256m-main-router.yml
    with:
      ebpf: true

  publication:
    name: Resolve preview publication
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.flag.outputs.enabled }}
    steps:
      - id: flag
        env:
          PREVIEW: ${{ inputs.publish_preview }}
        run: printf 'enabled=%s\n' "$PREVIEW" >> "$GITHUB_OUTPUT"

  publish:
    needs: [build, publication]
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.publication.outputs.enabled == 'true'
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/publish-profile.yml
    with:
      profile: libwrt-25.12-nss-ebpf
      title: ZN-M2 LiBwrt 6.12 NSS （eBPF）
      tag_slug: zn-m2-libwrt-6.12-nss-ebpf
      preview: true

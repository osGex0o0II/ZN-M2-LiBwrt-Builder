name: PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast PR validation
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Verify scripts, workflow contracts and regression tests
        run: bash scripts/ci-fast-validation.sh

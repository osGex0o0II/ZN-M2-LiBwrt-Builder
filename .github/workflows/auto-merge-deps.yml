name: Auto-merge dependency updates

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - ready_for_review
  workflow_run:
    workflows:
      - ZN-M2 1G Proxy Gateway
      - ZN-M2 256M Main Router
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  checks: read
  issues: write

concurrency:
  group: auto-merge-dependency-updates
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GH_REPO: ${{ github.repository }}

jobs:
  auto-merge:
    name: Merge safe dependency PRs after validation
    runs-on: ubuntu-latest

    steps:
      - name: Resolve candidate pull requests
        id: candidates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass event data through env so branch names are never interpolated
          # into the script text (shell-injection defense in depth).
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          case "${{ github.event_name }}" in
            pull_request_target)
              printf '%s\n' "$EVENT_PR_NUMBER" > prs.txt
              ;;
            workflow_run)
              branch="$EVENT_HEAD_BRANCH"
              if [ -z "$branch" ]; then
                : > prs.txt
              else
                gh pr list \
                  --state open \
                  --head "$branch" \
                  --json number \
                  --jq '.[].number' > prs.txt
              fi
              ;;
            *)
              : > prs.txt
              ;;
          esac

          if [ -s prs.txt ]; then
            {
              echo "numbers<<EOF"
              cat prs.txt
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "numbers=" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate and merge candidates
        if: steps.candidates.outputs.numbers != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_NUMBERS: ${{ steps.candidates.outputs.numbers }}
        run: |
          set -euo pipefail

          ensure_label() {
            name="$1"
            color="$2"
            description="$3"
            gh label create "$name" --color "$color" --description "$description" --force
          }

          ensure_pr_label() {
            pr_number="$1"
            label="$2"
            pr_json="$3"
            if ! printf '%s' "$pr_json" | jq -e --arg label "$label" 'any(.labels[]; .name == $label)' >/dev/null; then
              gh pr edit "$pr_number" --add-label "$label"
            fi
          }

          ensure_label "dependencies" "0366d6" "Dependency update"
          ensure_label "auto-update" "ededed" "Automated update"
          ensure_label "pinned-deps" "fbca04" "Pinned upstream dependency update"

          while read -r pr_number; do
            [ -n "$pr_number" ] || continue

            pr_json="$(gh pr view "$pr_number" --json author,baseRefName,headRefName,headRefOid,isDraft,labels,mergeStateStatus,reviewDecision,state,files,url)"

            url="$(printf '%s' "$pr_json" | jq -r '.url')"
            state="$(printf '%s' "$pr_json" | jq -r '.state')"
            is_draft="$(printf '%s' "$pr_json" | jq -r '.isDraft')"
            author="$(printf '%s' "$pr_json" | jq -r '.author.login')"
            head_ref="$(printf '%s' "$pr_json" | jq -r '.headRefName')"
            merge_state="$(printf '%s' "$pr_json" | jq -r '.mergeStateStatus')"
            review_decision="$(printf '%s' "$pr_json" | jq -r '.reviewDecision // ""')"

            echo "Evaluating ${url}"

            if [ "$state" != "OPEN" ] || [ "$is_draft" != "false" ]; then
              echo "Skip: PR is not open and ready."
              continue
            fi

            case "$author:$head_ref" in
              # The updater opens its pull request with the built-in GITHUB_TOKEN,
              # which GitHub attributes to the github-actions app identity, while
              # older runs used the github-actions[bot] login. Both identities are
              # trusted only for the pinned dependency update branch, and the file
              # whitelist plus both firmware validation builds still apply.
              github-actions\[bot\]:automation/pinned-deps-update|app/github-actions:automation/pinned-deps-update)
                ;;
              *)
                echo "Skip: author/head not allowed (${author}:${head_ref})."
                continue
                ;;
            esac

            ensure_pr_label "$pr_number" "dependencies" "$pr_json"
            ensure_pr_label "$pr_number" "auto-update" "$pr_json"
            ensure_pr_label "$pr_number" "pinned-deps" "$pr_json"

            if [ "$merge_state" = "DIRTY" ] || [ "$merge_state" = "UNKNOWN" ]; then
              echo "Skip: merge state is ${merge_state}."
              continue
            fi
            if [ "$review_decision" = "CHANGES_REQUESTED" ]; then
              echo "Skip: changes were requested."
              continue
            fi

            if ! printf '%s' "$pr_json" | jq -e '
              ([.files[].path] | length == 1) and
              ([.files[].path] | all(. == "deps/pinned-deps.env"))
            ' >/dev/null; then
              echo "Skip: pinned dependency PR changed files outside whitelist."
              continue
            fi

            # Validate the head commit's own check runs, which is the data branch
            # protection evaluates. The pull request rollup stays empty when the
            # validation builds are dispatched straight onto the update branch,
            # because those check suites belong to the branch ref.
            head_sha="$(printf '%s' "$pr_json" | jq -r '.headRefOid')"
            if [ -z "$head_sha" ] || [ "$head_sha" = "null" ]; then
              echo "Skip: pull request head commit is unknown."
              continue
            fi

            check_runs="$(gh api \
              "repos/${GH_REPO}/commits/${head_sha}/check-runs?per_page=100" \
              --jq '[.check_runs[]
                | {
                    name,
                    status,
                    conclusion,
                    started_at,
                    completed_at,
                    app: (.app.slug // "")
                  }]' 2>/dev/null || echo '[]')"

            # Only this repository's own workflows may satisfy the gate, and a
            # re-dispatched build adds a duplicate check run on the same commit,
            # so judge only the latest run per required check name.
            checks_ok="$(printf '%s' "$check_runs" | jq -r '
              [ .[]
                | select(
                    (.app == "github-actions") and
                    (
                      (.name == "Build ZN-M2 1G Proxy Gateway firmware") or
                      (.name == "Build ZN-M2 256M Main Router firmware")
                    )
                  ) ]
              | group_by(.name)
              | map(sort_by(.completed_at // .started_at // "") | last)
              | (length == 2) and
                all(.[]; .status == "completed" and .conclusion == "success")
            ')"

            if [ "$checks_ok" != "true" ]; then
              echo "Skip: required firmware validation builds have not both succeeded."
              printf '%s\n' "$check_runs" |
                jq -r '.[] | "  seen: \(.name) = \(.status)/\(.conclusion) (app=\(.app))"'
              continue
            fi

            # --auto leaves the final decision to GitHub, which re-evaluates the
            # required contexts on its side, and --match-head-commit keeps that
            # merge bound to the exact revision this gate just validated.
            echo "Queueing auto-merge for ${url} at ${head_sha}"
            gh pr merge "$pr_number" \
              --squash \
              --auto \
              --match-head-commit "$head_sha" \
              --delete-branch
          done <<< "$CANDIDATE_NUMBERS"

name: ZN-M2 ImmortalWrt 6.18-NSS（eBPF）

on:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish an opt-in preview after device validation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zn-m2-viking-6.18-nss-ebpf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-profile.yml
    with:
      profile: immortalwrt-viking-main-nss-ebpf
      title: ZN-M2 ImmortalWrt 6.18-NSS（eBPF）

  publication:
    name: Resolve preview publication
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.flag.outputs.enabled }}
    steps:
      - id: flag
        env:
          PREVIEW: ${{ inputs.publish_preview }}
        run: printf 'enabled=%s\n' "$PREVIEW" >> "$GITHUB_OUTPUT"

  publish:
    needs: [build, publication]
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.publication.outputs.enabled == 'true'
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/publish-profile.yml
    with:
      profile: immortalwrt-viking-main-nss-ebpf
      title: ZN-M2 ImmortalWrt 6.18-NSS（eBPF）
      tag_slug: zn-m2-viking-6.18-nss-ebpf
      preview: true

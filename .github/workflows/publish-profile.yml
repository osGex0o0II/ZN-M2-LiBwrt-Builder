name: Publish ZN-M2 profile release

on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      title:
        required: true
        type: string
      tag_slug:
        required: true
        type: string
      preview:
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  publish:
    name: Publish ${{ inputs.title }} release
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-profile-${{ inputs.profile }}
      cancel-in-progress: false
    env:
      # This job never checks out the repository, so every gh call must be told
      # which repository to talk to instead of inferring it from git.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out the builder scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the built firmware
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "firmware-${PROFILE}" \
            --dir release
          ls -l release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ inputs.profile }}
          TITLE: ${{ inputs.title }}
          SLUG: ${{ inputs.tag_slug }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          set -euo pipefail
          tag="v$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${SLUG}"
          grep -Fxq "Profile: $PROFILE" release/BUILD-MANIFEST.txt
          grep -Fxq "Builder commit: $GITHUB_SHA" release/BUILD-MANIFEST.txt
          (cd release && sha256sum --check SHA256SUMS)
          release_flags=(--latest)
          if [ "$PREVIEW" = true ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF" = refs/heads/main
            grep -Fxq 'Software policy: aurora-honk' release/BUILD-MANIFEST.txt
            release_flags=(--prerelease --latest=false)
          fi
          bash scripts/release-notes.sh "$PROFILE" release release/BUILD-MANIFEST.txt > notes.md
          # Publish only the two flashing images. The package list stays in the
          # workflow artifact; its checksums and source/build provenance are in
          # the release notes, so a separate SHA256SUMS asset is not needed.
          factory=$(find release -maxdepth 1 -type f -name '*-factory.ubi' -print -quit)
          sysupgrade=$(find release -maxdepth 1 -type f -name '*-sysupgrade.bin' -print -quit)
          test -n "$factory" && test -n "$sysupgrade"
          gh release create "$tag" "$factory" "$sysupgrade" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${TITLE}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" "${release_flags[@]}"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "published ${tag}" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep one release and one artifact per build line
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ inputs.profile }}
          SLUG: ${{ inputs.tag_slug }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          set -euo pipefail
          old_tags=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
            jq -r --arg slug "$SLUG" --arg current "$RELEASE_TAG" --argjson preview "$PREVIEW" \
              -f scripts/select-profile-releases.jq)
          while IFS= read -r old; do
            [ -n "$old" ] || continue
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            echo "pruned release ${old}"
          done <<< "$old_tags"
          # Artifact retention is housekeeping: a failed delete must not fail a
          # publish job that already created the release. Keep the warning so a
          # genuinely broken token scope is still visible in the log.
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"firmware-${PROFILE}\") | select(.workflow_run.id != ${GITHUB_RUN_ID}) | .id" |
            while read -r artifact; do
              if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact}"; then
                echo "pruned artifact ${artifact}"
              else
                echo "::warning::failed to prune artifact ${artifact}"
              fi
            done


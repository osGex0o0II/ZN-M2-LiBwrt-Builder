name: Publish ZN-M2 profile release

on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      title:
        required: true
        type: string
      tag_slug:
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish ${{ inputs.title }} release
    runs-on: ubuntu-24.04
    env:
      # This job never checks out the repository, so every gh call must be told
      # which repository to talk to instead of inferring it from git.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out the builder scripts
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Download the built firmware
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "experimental-${PROFILE}" \
            --dir release
          ls -l release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ inputs.profile }}
          TITLE: ${{ inputs.title }}
          SLUG: ${{ inputs.tag_slug }}
        run: |
          set -euo pipefail
          tag="v$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${SLUG}"
          bash scripts/release-notes.sh "$PROFILE" release > notes.md
          # Publish only the two flashing images. The manifest, package list and
          # build info stay in the workflow artifact; their checksums are in the
          # release notes, so a separate SHA256SUMS asset is not needed.
          factory=$(find release -maxdepth 1 -type f -name '*-factory.ubi' -print -quit)
          sysupgrade=$(find release -maxdepth 1 -type f -name '*-sysupgrade.bin' -print -quit)
          test -n "$factory" && test -n "$sysupgrade"
          gh release create "$tag" "$factory" "$sysupgrade" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${TITLE}" \
            --notes-file notes.md
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "published ${tag}" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep one release and one artifact per build line
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ inputs.profile }}
          SLUG: ${{ inputs.tag_slug }}
        run: |
          set -euo pipefail
          # An empty result is expected on the first publish of a line; without
          # the guard pipefail turns grep's exit 1 into a failed job.
          { gh release list --limit 100 --json tagName --jq '.[].tagName' |
            grep -F -- "-${SLUG}" |
            grep -vxF "$RELEASE_TAG" || true; } |
            while read -r old; do
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              echo "pruned release ${old}"
            done
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"experimental-${PROFILE}\") | select(.workflow_run.id != ${GITHUB_RUN_ID}) | .id" |
            while read -r artifact; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact}"
              echo "pruned artifact ${artifact}"
            done


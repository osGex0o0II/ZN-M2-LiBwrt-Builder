name: Prune Actions caches

on:
  schedule:
    # 20:30 UTC = 04:30 Asia/Shanghai, ahead of the daily dependency build.
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report the caches that would be deleted'
        required: false
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GH_REPO: ${{ github.repository }}

jobs:
  prune:
    name: Prune stale build caches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Report cache usage before pruning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${GH_REPO}/actions/cache/usage" --jq '
            "active_caches=\(.active_caches_count) size_gb=\((.active_caches_size_in_bytes / 1073741824 * 100 | floor) / 100)"
          '

      - name: Select stale caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${GH_REPO}/actions/caches?per_page=100&sort=created_at&direction=desc" \
            --jq '.actions_caches[] | [.id, .ref, .key, .size_in_bytes] | @tsv' > caches.tsv
          # Pull-request scoped caches can only be restored by a re-run of that
          # pull request, so they are dead weight once it is merged or closed.
          # Branch scoped caches keep the newest two generations per family and
          # kernel variant so a rebuild still has a fallback generation to
          # restore from. The apt download cache is keyed by the runner image
          # and shared by all builds, so a single generation per ref is enough.
          # Legacy 1G caches are deleted unconditionally: that variant no longer
          # exists, so no future build can restore them.
          awk -F '\t' '
            $2 ~ /^refs\/pull\// { print; next }
            $3 ~ /zn-m2-1g/ { print; next }
            {
              family = ($3 ~ /-dl-/) ? "dl" : (($3 ~ /-ccache-/) ? "ccache" : (($3 ~ /apt-archives-/) ? "apt" : "other"))
              if (family == "apt") {
                variant = "shared"
              } else if ($3 ~ /-6\.18-/) {
                variant = "6.18"
              } else {
                variant = "6.12"
              }
              group = family "-" variant SUBSEP $2
              keep = (family == "apt") ? 1 : 2
              seen[group]++
              if (seen[group] > keep) print
            }
          ' caches.tsv > stale.tsv
          echo "total_caches=$(wc -l < caches.tsv) stale_caches=$(wc -l < stale.tsv)"
          if [ -s stale.tsv ]; then
            echo "Caches selected for deletion:"
            cut -f2,3 stale.tsv
          fi

      - name: Delete stale caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [ ! -s stale.tsv ]; then
            echo "No stale caches found"
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: nothing was deleted"
            exit 0
          fi
          while IFS=$'\t' read -r cache_id cache_ref cache_key cache_size; do
            [ -n "$cache_id" ] || continue
            echo "Deleting ${cache_key} (${cache_ref}, ${cache_size} bytes)"
            gh api -X DELETE "repos/${GH_REPO}/actions/caches/${cache_id}" >/dev/null ||
              echo "::warning::failed to delete cache ${cache_id} (${cache_key})"
          done < stale.tsv

      - name: Enforce global cache quota
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CACHE_QUOTA_BYTES: "8589934592"
        run: |
          set -euo pipefail
          # Oldest first. This is the last-resort cap: even when every family
          # is within its per-variant retention, the repository stays under 8GB.
          gh api --paginate \
            "repos/${GH_REPO}/actions/caches?per_page=100&sort=last_accessed_at&direction=asc" \
            --jq '.actions_caches[] | [.id, .size_in_bytes, .key, .ref] | @tsv' > all-caches.tsv
          total="$(awk -F '\t' '{sum += $2} END {print sum + 0}' all-caches.tsv)"
          echo "cache_bytes=${total} quota_bytes=${CACHE_QUOTA_BYTES}"
          while IFS=$'\t' read -r cache_id cache_size cache_key cache_ref; do
            [ -n "$cache_id" ] || continue
            case "$cache_size" in
              ''|*[!0-9]*) cache_size=0 ;;
            esac
            [ "$total" -le "$CACHE_QUOTA_BYTES" ] && break
            echo "Deleting over-quota cache ${cache_key} (${cache_ref}, ${cache_size} bytes)"
            if gh api -X DELETE "repos/${GH_REPO}/actions/caches/${cache_id}" >/dev/null; then
              total=$((total - cache_size))
            else
              echo "::warning::failed to delete over-quota cache ${cache_id} (${cache_key})"
            fi
          done < all-caches.tsv
          echo "cache_bytes_after=${total}"

      - name: Report cache usage after pruning
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${GH_REPO}/actions/cache/usage" --jq '
            "active_caches=\(.active_caches_count) size_gb=\((.active_caches_size_in_bytes / 1073741824 * 100 | floor) / 100)"
          '

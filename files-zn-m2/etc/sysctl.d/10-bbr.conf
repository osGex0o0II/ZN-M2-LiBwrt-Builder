# ============================================================
# BBR 拥塞控制 + fq qdisc 传输层调优（256M 变体：2MiB 缓冲区）
# 适用场景：LiBwrt NSS / ImmortalWrt 6.18 千兆有线路由（256MB 内存）
# 参考：torvalds/linux/net/ipv4/tcp_bbr.c | man tc-fq(8)
#       kernel.org sysctl/net.html | OpenWrt #7733
#       RFC 7413 | Red Hat EL 9/10 网络性能调优
# ============================================================
#
# 与 files/etc/sysctl.d/10-bbr.conf 同名，通过 OpenWrt file overlay
# 机制直接替换，不依赖数字排序。可用内存受 WCSS carveout 保留区（16MiB）影响，
# 真机实测 MemTotal 约 192–196MiB。
#
# 2MiB 缓冲区上限的依据：
#   - 默认 tcp_adv_win_scale=1 时，有效接收窗口约为 tcp_rmem 上限的一半；
#     512KB 上限只有 256KB 窗口，200ms RTT 下单流约 10Mbps。
#   - 2MiB 上限 → 1MiB 窗口，200ms RTT 下单流约 42Mbps，覆盖 4K 串流；
#     100ms RTT 下约 84Mbps。
#   - 全局 net.ipv4.tcp_mem 保持内核默认（本机约 9/12/18MB），
#     单 socket 上限提高但聚合 TCP 内存仍被 18MB 硬顶约束，避免 OOM。
#   - 只有高 RTT 的大流量 socket 会增长；LAN 小流量不受影响。
#   - 如果未来确认多流被 tcp_mem 压制，再把 tcp_mem 提到 24–32MB，
#     而不是继续放大单 socket。

# BBR（Bottleneck Bandwidth and Round-trip propagation time）：
# 基于带宽估计的拥塞控制算法，替代传统基于丢包的 CUBIC/Reno。
# BBR 要求底层 qdisc 提供 pacing（速率整形）功能。
# fq（Fair Queue）是当前唯一支持 per-flow pacing 的 classless qdisc。
# !!! fq_codel 不含 pacing，BBR + fq_codel 性能下降 6-10 倍 !!!
# 实测数据（OpenWrt #7733）：fq_codel=4-10MB/s, fq=40-60MB/s
net.ipv4.tcp_congestion_control=bbr

# TCP Fast Open（RFC 7413）：
#   0x1 = 客户端模式   0x2 = 服务端模式   0x4 = 客户端无 cookie
#   值 3 = 同时启用客户端和服务端
#   Linux 3.7+ 支持，安全性由 TFO cookie 机制保证
net.ipv4.tcp_fastopen=3

# TCP 缓冲区调优 — 基于带宽延迟积（BDP）计算
# 2MiB 单 socket 上限 + 内核默认 tcp_mem 聚合上限（约 18MB）。
net.core.rmem_max=2097152
net.core.wmem_max=2097152
net.ipv4.tcp_rmem=4096 131072 2097152
net.ipv4.tcp_wmem=4096 65536 2097152

# slow_start_after_idle=0 — 空闲后不重置 cwnd，减少突发延迟
# tcp_notsent_lowat=131072 — Cloudflare 生产值；16KB 会限制高 BDP 发送队列，
#   拉低代理单流吞吐并增加唤醒次数。
net.ipv4.tcp_slow_start_after_idle=0
net.ipv4.tcp_notsent_lowat=131072

# Per-CPU ingress queue. 6.18 没有 NSS，路由/代理流量更多经过 CPU，
# 突发时 1000 容易丢包；翻倍到 2000（内核默认 1000），
# 用 /proc/net/softnet_stat 第二列观察是否仍有 backlog drop。
net.core.netdev_max_backlog=2000

# fq qdisc — BBR 依赖 per-flow pacing，fq 是唯一支持 classless qdisc。
# !!! fq_codel 不含 pacing，BBR + fq_codel 性能下降 6-10 倍 !!!
# 实测（OpenWrt #7733）：fq_codel=4-10MB/s, fq=40-60MB/s。
net.core.default_qdisc=fq
